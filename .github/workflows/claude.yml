# Claude on GitHub (Harry, 20 Nov 2026): jobs here are paid from the Anthropic API credit,
# not anyone's Claude plan. Needs the secret ANTHROPIC_API_KEY
# (repo Settings > Secrets and variables > Actions). The website is not affected by this file.
#
# Two ways to start a job:
#  1. Write "@claude" plus the job in an issue, an issue comment or a pull-request comment.
#     Only people with write access to the repo can start one.
#  2. Actions tab > "Claude" > Run workflow: type the job, pick the branch and the model.
# Claude works on its own branch and opens a pull request into the branch the job names.
# Nothing is merged or deployed by a job.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  workflow_dispatch:
    inputs:
      prompt:
        description: "The job for Claude"
        required: true
        type: string
      model:
        description: "Model"
        required: true
        default: "claude-opus-5-5"
        type: choice
        options:
          - claude-opus-5-5
          - claude-sonnet-5-5
          - claude-fable-5-2
          - claude-haiku-5-5

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || '' }}
          claude_args: >-
            --model ${{ github.event_name == 'workflow_dispatch' && inputs.model || 'claude-opus-5-5' }}
            --max-turns 120
