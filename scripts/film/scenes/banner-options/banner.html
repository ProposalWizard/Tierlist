<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<style>
@font-face { font-family: Anton; src: url(anton.woff2) format("woff2"); }
html, body { margin: 0; width: 390px; height: 844px; overflow: hidden; background: #0b1020; }
.stage { position: relative; width: 390px; height: 844px; background: url(frame.jpg) center/390px 844px no-repeat; }
.a, .b, .c, .vig { position: absolute; pointer-events: none; opacity: 0; }
body.hold .a, body.hold .b, body.hold .c, body.hold .vig { opacity: 1; animation: none !important; }
body.hold .vig { opacity: .75; }

/* A — the match's own lettering (the GOAL word: Anton, italic, big shadow), amber, with one heartbeat */
.a { left: 0; right: 0; top: 49%; text-align: center; font-family: Anton, Impact, sans-serif; }
.a .w { display: inline-block; font-size: 52px; font-style: italic; letter-spacing: .04em; color: #fcd34d; line-height: 1;
        text-shadow: 0 3px 10px rgba(0,0,0,.95), 0 0 2px rgba(0,0,0,.9); transform-origin: center; }
.a .s { margin-top: 6px; font-size: 14px; letter-spacing: .28em; color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.95); }
body.play .a { animation: a-show 2.3s .4s both; }
body.play .a .w { animation: a-beat 2.3s .4s both; }
@keyframes a-show { 0% { opacity: 0 } 6% { opacity: 1 } 84% { opacity: 1 } 100% { opacity: 0 } }
@keyframes a-beat { 0% { transform: scale(.6) } 8% { transform: scale(1.08) } 13% { transform: scale(1) }
  30% { transform: scale(1) } 33% { transform: scale(1.07) } 37% { transform: scale(1) } 41% { transform: scale(1.04) } 45% { transform: scale(1) }
  66% { transform: scale(1) } 69% { transform: scale(1.07) } 73% { transform: scale(1) } 77% { transform: scale(1.04) } 81% { transform: scale(1) } 100% { transform: scale(1) } }

/* B — a TV caption in the Broadcast pop-up pack's look: navy strip, red minute tab, red edge, a shine */
.b { left: 14px; top: 100px; height: 40px; display: flex; align-items: stretch; font-family: Anton, Impact, sans-serif;
     clip-path: polygon(0 0, 100% 0, calc(100% - 9px) 100%, 0 100%); box-shadow: inset 0 -3px 0 #ff4d5e; }
.b .tab { background: linear-gradient(180deg,#ff6b6b,#d1142f); color: #fff; font-size: 19px; padding: 0 10px; display: flex; align-items: center; letter-spacing: .02em; }
.b .txt { background: linear-gradient(180deg,rgba(14,22,40,.97),rgba(6,10,20,.97)); color: #fff; padding: 0 18px 0 12px; display: flex; flex-direction: column; justify-content: center; position: relative; overflow: hidden; }
.b .t1 { font-size: 20px; letter-spacing: .08em; line-height: 1; }
.b .t2 { font-family: Arial, sans-serif; font-weight: 700; font-size: 10px; letter-spacing: .18em; color: #ffb3bb; margin-top: 3px; }
.b .shine { position: absolute; inset: 0 auto 0 0; width: 40%; background: linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.2),rgba(255,255,255,0)); transform: translateX(-120%) skewX(-20deg); }
body.play .b { animation: b-show 2.3s .4s both; }
body.play .b .shine { animation: b-shine 2.3s .4s both; }
@keyframes b-show { 0% { opacity: 1; clip-path: polygon(0 0, 0 0, 0 100%, 0 100%) } 11% { clip-path: polygon(0 0, 100% 0, calc(100% - 9px) 100%, 0 100%) }
  86% { opacity: 1; clip-path: polygon(0 0, 100% 0, calc(100% - 9px) 100%, 0 100%) } 100% { opacity: 1; clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%) } }
@keyframes b-shine { 0%, 12% { transform: translateX(-120%) skewX(-20deg) } 40%, 100% { transform: translateX(300%) skewX(-20deg) } }

/* C — no words over the pitch: the edges of the screen pulse red with the heartbeat; a small chip under the score */
.vig { top: 86px; left: 13px; right: 13px; bottom: 14px; background: radial-gradient(ellipse 75% 62% at 50% 52%, rgba(0,0,0,0) 55%, rgba(200,20,40,.55) 100%); }
.c { left: 0; right: 0; top: 96px; text-align: center; }
.c span { display: inline-block; font-family: Anton, Impact, sans-serif; font-size: 15px; letter-spacing: .22em; color: #fff;
          background: rgba(170,14,34,.92); padding: 4px 12px 3px; border-radius: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.5); }
body.play .vig { animation: c-vig 2.5s .4s both; }
body.play .c { animation: c-chip 2.5s .4s both; }
@keyframes c-vig { 0% { opacity: 0 } 6% { opacity: .9 } 18% { opacity: .25 } 26% { opacity: .7 } 36% { opacity: .2 }
  40% { opacity: .85 } 52% { opacity: .25 } 59% { opacity: .65 } 70% { opacity: .2 } 74% { opacity: .8 } 86% { opacity: .25 } 100% { opacity: 0 } }
@keyframes c-chip { 0% { opacity: 0; transform: translateY(-6px) } 8% { opacity: 1; transform: none } 88% { opacity: 1 } 100% { opacity: 0 } }
</style></head>
<body>
<div class="stage">
  <div class="vig"></div>
  <div class="a"><div class="w">BIG MOMENT</div><div class="s">LATE ON · 1–1</div></div>
  <div class="b"><div class="tab">89'</div><div class="txt"><div class="t1">BIG MOMENT</div><div class="t2">LEVEL · IT'S ON YOU</div><div class="shine"></div></div></div>
  <div class="c"><span>BIG MOMENT · 89'</span></div>
</div>
<script>
const q = new URLSearchParams(location.search), v = q.get("v") || "A", mode = q.get("mode") || "play";
const keep = { A: [".a"], B: [".b"], C: [".c", ".vig"], none: [] }[v] || [];
for (const el of document.querySelectorAll(".a,.b,.c,.vig")) if (!keep.some((s) => el.matches(s))) el.remove();
document.fonts.load("52px Anton").then(() => document.body.classList.add(mode));
</script>
</body></html>
