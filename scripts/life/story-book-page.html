<title>The Story Book</title>
<link rel="artifact-thumbnail" href="thumb.jpg">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a lean grid of story tiles (one real screenshot each); a story opens as its own page, a
   player: the beat's real screenshot, its lines, the choices as buttons, what happens, next. */
:root {
  --bg: #f4f7f5; --surface: #ffffff; --card2: #eef3f0; --ink: #0e1613; --muted: #4a6157; --muted2: #6b8176; --line: #dae4de; --accent: #0f9d58; --accent-weak: #e1f3e8;
  --gold: #a8730a; --gold-weak: #fbf0d6; --red: #c62828; --red-weak: #fbe4e2; --blue: #1565c0; --blue-weak: #e3edf9;
  --phone: #05070d; --scrim: rgba(8, 12, 10, 0.94); --on-scrim: #f2f6f3; --on-scrim-muted: #b4c2b9;
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; --font-head: var(--font-ui);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b100e; --surface: #141d18; --card2: #192520; --ink: #f2f7f4; --muted: #9fb6aa; --muted2: #6f8679; --line: #24332b; --accent: #3ddc84; --accent-weak: #16301f;
    --gold: #f5b942; --gold-weak: #34290f; --red: #ff6b6b; --red-weak: #3a1d1d; --blue: #6fb8ff; --blue-weak: #15283c; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b100e; --surface: #141d18; --card2: #192520; --ink: #f2f7f4; --muted: #9fb6aa; --muted2: #6f8679; --line: #24332b; --accent: #3ddc84; --accent-weak: #16301f;
  --gold: #f5b942; --gold-weak: #34290f; --red: #ff6b6b; --red-weak: #3a1d1d; --blue: #6fb8ff; --blue-weak: #15283c; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 15.5px; line-height: 1.5; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 56px; overflow-wrap: anywhere; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.wrap { max-width: 760px; margin: 0 auto; min-width: 0; }
h1.big { font-size: clamp(28px, 7.5vw, 40px); line-height: 1.05; margin: 34px 0 10px; letter-spacing: -.025em; }
.sum { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 14px; margin: 0 0 8px; }
.sum p { margin: 0; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
.sum p:last-child { border: 0; }
.sum .bars { display: flex; gap: 6px; flex-wrap: wrap; }
.sum .n { display: inline-flex; gap: 5px; align-items: baseline; background: var(--card2); border-radius: 8px; padding: 3px 9px; font-size: 13.5px; }
.sum .lab2 { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted2); margin-bottom: 5px; }
.sum .n b { font-size: 16px; font-variant-numeric: tabular-nums; }
/* the sheet: a story (or a More page) slides up over the grid */
.sheet { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 60px) max(16px, env(safe-area-inset-left, 0px)); animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.sheet-bar { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 10px; padding: calc(env(safe-area-inset-top, 0px) + 10px) 0 10px; border-bottom: 1px solid var(--line); max-width: 760px; margin: 0 auto; }
.sheet-bar .tt { flex: 1; min-width: 0; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sheet-in { max-width: 760px; margin: 0 auto; }
h1, h2, h3, h4 { font-family: var(--font-head); margin: 0; text-wrap: balance; line-height: 1.2; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }
.grey { color: var(--muted); }
.tiny { font-size: 12.5px; }
.ph { color: var(--accent); font-weight: 600; }
.cond { background: var(--gold-weak); border-radius: 4px; padding: 0 3px; }
.cond .cw { font-size: 11.5px; font-weight: 600; color: var(--gold); margin-right: 4px; }
.cond .cw::before { content: "if "; }

/* top bar */
.top { padding: 0; }
.tools { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line); }
.row1 { display: flex; align-items: center; gap: 10px; }
.row1 h1 { font-size: 22px; letter-spacing: -0.01em; flex: 1; min-width: 0; }
.row1 h1 a { color: inherit; text-decoration: none; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 11px; border-radius: 8px; font-size: 14px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.more { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px; display: grid; min-width: 220px; z-index: 40; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.menu a { padding: 8px 10px; border-radius: 6px; text-decoration: none; color: var(--ink); }
.menu a:hover { background: var(--accent-weak); }
.sub { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
.tools { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.tile .one { font-size: 13px; color: var(--muted); line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.search { flex: 1 1 180px; min-width: 0; padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.tools select { padding: 7px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); flex: 1 1 0; min-width: 0; }
.tools .sel { order: 3; display: flex; gap: 6px; flex: 1 1 100%; min-width: 0; }
.tools .count { order: 4; flex: 1 1 100%; font-size: 12px; }
.count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* home grid */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 12px; margin-top: 14px; }
@media (min-width: 700px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.tile { all: unset; box-sizing: border-box; cursor: pointer; display: grid; gap: 6px; align-content: start; min-width: 0; }
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 10px; }
.thumb { width: 100%; aspect-ratio: 3 / 4; border-radius: 10px; background-color: var(--phone); background-repeat: no-repeat; position: relative; overflow: hidden; }
.thumb .vid { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.72); color: #fff; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
.tile .t { font-weight: 800; font-size: 16px; line-height: 1.2; letter-spacing: -.01em; }
.tile .m { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.size { display: inline-block; font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 0 6px; border-radius: 999px; margin-right: 4px; background: var(--accent-weak); color: var(--accent); }
.size.big { background: var(--gold-weak); color: var(--gold); }
.size.tier-common { background: var(--card2); color: var(--muted); }
.size.tier-uncommon { background: var(--accent-weak); color: var(--accent); }
.size.tier-rare { background: var(--blue-weak); color: var(--blue); }
.size.tier-very-rare { background: var(--gold-weak); color: var(--gold); }
.size.tier-legendary { background: var(--gold); color: var(--surface); }
.chain { margin: 8px 0 0; font-size: 14px; }
.wbtn { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 12px; align-items: center; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px; text-align: left; cursor: pointer; }
.wbtn:hover { border-color: var(--accent); }
.wbtn b { display: block; font-size: 16px; }
.wth { display: block; width: 64px; aspect-ratio: 3 / 4; border-radius: 8px; background-color: var(--phone); background-repeat: no-repeat; }
.lab3 { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--muted2); }
.size.wait { background: var(--red-weak); color: var(--red); }
.empty { padding: 30px 0; text-align: center; color: var(--muted); }

/* story page */
.back { margin-top: 14px; }
.shead h2 { font-size: clamp(26px, 6vw, 38px); margin-top: 10px; letter-spacing: -0.01em; }
.shead .line { margin-top: 6px; color: var(--muted); font-size: 14px; }
.shead .prem { margin-top: 8px; max-width: 62ch; }
.watch { margin-top: 12px; }
.watch video { display: block; width: min(100%, 380px); aspect-ratio: 720 / 1560; background: var(--phone); border-radius: 14px; margin-top: 10px; }
.path { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 6px; margin-top: 10px; border-top: 1px solid var(--line); scrollbar-width: thin; }
.pdot { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 11px; font-size: 13px; font-weight: 600; color: var(--muted); }
.pdot.side { padding: 4px 8px; font-weight: 500; }
.pdot[aria-current="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pdot.end { color: var(--gold); }
.player { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; margin-top: 12px; }
@media (min-width: 720px) { .player { grid-template-columns: 320px minmax(0, 1fr); align-items: start; } .shotcol { position: sticky; top: 70px; } }
.shotcol { min-width: 0; }
.bigshot { all: unset; box-sizing: border-box; display: block; width: min(100%, 340px); margin: 0 auto; aspect-ratio: 360 / 779; border-radius: 16px; background-color: var(--phone); background-repeat: no-repeat; cursor: zoom-in; position: relative; }
.bigshot.dim::after { content: attr(data-note); position: absolute; inset: auto 10px 12px; background: rgba(0,0,0,.78); color: #fff; font-size: 12.5px; padding: 6px 9px; border-radius: 8px; text-align: center; }
.shotcap { text-align: center; font-size: 12.5px; color: var(--muted); margin-top: 6px; }
.script { min-width: 0; }
.bk { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted2); font-weight: 800; }
.script h3 { font-size: 21px; margin-top: 2px; }
.when { font-size: 13px; color: var(--muted); margin-top: 2px; }
.scene { font-style: italic; margin: 10px 0; padding-left: 12px; border-left: 3px solid var(--line); }
.say { margin: 8px 0; font-size: 16px; }
.say b { font-family: var(--font-head); text-transform: uppercase; letter-spacing: .03em; font-size: 12.5px; color: var(--accent); display: block; }
.choices { display: grid; gap: 8px; margin-top: 12px; }
.choice { all: unset; box-sizing: border-box; cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 11px 13px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; font-weight: 500; }
.choice:hover { border-color: var(--accent); }
.choice:focus-visible { outline: 2px solid var(--accent); }
.choice .tone { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
.choice .req { grid-column: 1 / -1; font-size: 12px; color: var(--muted); font-weight: 400; }
.choice.seen { border-left: 4px solid var(--accent); }
.result { margin-top: 14px; padding: 13px 14px; border-radius: 12px; background: var(--accent-weak); }
.result .you { font-size: 13px; color: var(--muted); }
.result .txt { margin-top: 6px; font-size: 16px; }
.result .if { font-size: 12px; font-weight: 700; color: var(--gold); margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 12.5px; padding: 2px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.chip.end { border-color: var(--gold); color: var(--gold); font-weight: 600; }
.chip.next { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.nav2 { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.main { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
.game { margin-top: 12px; padding: 12px 13px; border-radius: 12px; border: 2px solid var(--blue); background: var(--blue-weak); }
.game b { font-family: var(--font-head); }
details.more2 { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 8px; }
details.more2 > summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); }
.dl { font-size: 13.5px; }
.dl h5 { margin: 10px 0 2px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.dl ul { margin: 2px 0; padding-left: 18px; }
.ends { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 10px; }
.endc { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px; display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 10px; align-items: start; }
.endc .mini { all: unset; width: 74px; aspect-ratio: 360 / 779; border-radius: 8px; background-color: var(--phone); background-repeat: no-repeat; cursor: zoom-in; }
.endc .mini.none { display: grid; place-items: center; font-size: 11px; color: var(--on-scrim-muted); text-align: center; padding: 4px; cursor: default; }
.endc h4 { font-size: 15px; }
.endc p { margin: 4px 0 0; font-size: 13.5px; }
.endc .how { font-size: 12px; color: var(--muted); margin-top: 6px; }
.sec { margin-top: 26px; }
.sec > h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .14em; color: var(--muted2); font-weight: 800; }

/* more pages */
.irow { margin: 8px 0; padding: 11px 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.irow .nm { font-weight: 700; font-family: var(--font-head); }
.irow .sm { font-size: 13.5px; color: var(--muted); }
.irow.bad { border-left: 4px solid var(--red); }
.gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; margin-top: 10px; }
.gal button { all: unset; cursor: pointer; display: grid; gap: 4px; min-width: 0; }
.gal .im { width: 100%; aspect-ratio: 3 / 4; border-radius: 10px; background-color: var(--phone); background-repeat: no-repeat; background-size: cover; background-position: center; }
.gal .cap { font-size: 12px; color: var(--muted); }
.gal .cap b { color: var(--ink); display: block; }

/* enlarged view */
.lb { position: fixed; inset: 0; z-index: 60; background: var(--scrim); color: var(--on-scrim); display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; padding: calc(env(safe-area-inset-top, 0px) + 10px) max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px)); }
.lb .bar2 { display: flex; justify-content: flex-end; }
.lb button { border: 1px solid var(--on-scrim-muted); background: transparent; color: var(--on-scrim); border-radius: 999px; padding: 7px 14px; font-weight: 600; }
.lb .im { justify-self: center; height: 100%; max-width: 100%; aspect-ratio: 360 / 779; background-repeat: no-repeat; background-color: var(--phone); border-radius: 14px; }
.lb .im.free { aspect-ratio: auto; width: 100%; background-size: contain; background-position: center; background-color: transparent; }
.lb .cap { text-align: center; font-size: 14px; color: var(--on-scrim); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <header class="top">
    <h1 class="big"><a href="#" id="home" style="color:inherit;text-decoration:none">The Story Book</a></h1>
    <div class="sum" id="sum"><p id="stamp">Loading the book…</p></div>
  </header>
  <div class="tools" id="tools">
    <input class="search" id="q" type="search" placeholder="Search a title, a person, any word" aria-label="Search" autocomplete="off">
    <div class="sel">
    <select id="f-tier" aria-label="Rarity"><option value="">Any rarity</option><option value="legendary">Legendary</option><option value="very-rare">Very rare</option><option value="rare">Rare</option><option value="uncommon">Uncommon</option><option value="common">Common</option></select>
    <select id="f-size" aria-label="Size"><option value="">Any size</option><option value="big">Big</option><option value="medium">Medium</option><option value="small">Small</option></select>
    <select id="f-role" aria-label="Who is in it"><option value="">Anyone</option></select>
    </div>
    <div class="more">
      <button class="btn" id="morebtn" aria-expanded="false" aria-haspopup="true">More ▾</button>
      <div class="menu" id="menu" hidden>
        <a href="#more-gallery">People and places</a>
        <a href="#more-problems">Seen on screen: problems</a>
        <a href="#more-oddities">Oddities in the story files</a>
        <a href="#more-items">Items the stories give</a>
        <a href="#more-links">Links between stories</a>
      </div>
    </div>
    <span class="count" id="count"></span>
  </div>
  <main id="view"></main>
</div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-tt">
  <div class="sheet-bar"><button class="btn" id="sheet-close" type="button">✕ Close</button><span class="tt" id="sheet-tt"></span></div>
  <div class="sheet-in" id="sheet-in"></div>
</div>

<script>
(function () {
  var PH0 = "", PH1 = "", IF0 = "", IF1 = "", IFS = "";
  var D = null, SH = null, V = {}, S = [], bySlug = {}, byId = {};
  var F = { q: "", size: "", role: "", video: false, game: false, tier: "" };

  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) { var v = attrs[k]; if (v === null || v === undefined || v === false) continue; if (k === "text") e.textContent = v; else if (k === "class") e.className = v; else e.setAttribute(k, v === true ? "" : v); }
    (kids || []).forEach(function (c) { if (c === null || c === undefined || c === false) return; e.appendChild(typeof c === "string" ? document.createTextNode(c) : c); });

  function words(s) { return plain(s).toLowerCase().replace(/[^a-z0-9' ]+/g, " ").split(/\s+/).filter(function (w) { return w.length > 2; }); }
  function like(a, b) { var A = words(a), B = words(b); if (!A.length || !B.length) return false; var n = 0; A.forEach(function (w) { if (B.indexOf(w) >= 0) n++; }); return n / Math.max(A.length, B.length) >= 0.55; }
  function mmss(s) { return Math.floor(s / 60) + ":" + ("0" + (s % 60)).slice(-2); }

  /* ── screenshots: each is a cell of its story's sheet, drawn as a background ── */
  function shotsOf(s) { var x = SH && SH.stories[s.slug]; return x && x.shots && x.shots.length ? x : null; }
  function cellOf(list, i) { for (var k = 0; k < list.length; k++) { var sh = list[k]; if (i >= sh.from && i < sh.from + sh.count) { var j = i - sh.from; return { img: sh.file, cols: sh.cols, rows: sh.rows, c: j % sh.cols, r: Math.floor(j / sh.cols) }; } } return null; }
  function place(e) {
    var c = e._cell; if (!c) return;
    var w = e.clientWidth, ch = w * 779 / 360, f = Number(e.getAttribute("data-f") || 0);
    e.style.backgroundImage = "url(" + c.img + ")";
    e.style.backgroundSize = (c.cols * w) + "px " + (c.rows * ch) + "px";
    e.style.backgroundPosition = (-c.c * w) + "px " + (-(c.r * ch + f * Math.max(0, ch - e.clientHeight))) + "px";
  }

    }
