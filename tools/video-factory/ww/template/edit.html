<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:Anton;src:url(anton.ttf)}html,body{margin:0;background:#000}</style></head>
<body><canvas id="c" width="720" height="1280"></canvas>
<script src="avatars.js"></script>
<script>
// "Who would win?" template (tools/video-factory/ww). The approved Man United v Roma v4 look, driven by data:
// window.MATCH (the match.json, paths made absolute) and window.TL (the timeline: segments, voice captions),
// both injected by render.mjs before this page runs. Never edit this file for one video: change the json.
const FPS = 30, W = 720, H = 1280, CX = 340; // CX: middle of the safe area
const cv = document.getElementById("c"), g = cv.getContext("2d");
const GOLD = "#ffd23f", RED = "#e0262f", GREEN = "#16d466", NAVY = "#0b1022";
const ease = t => { t = Math.max(0, Math.min(1, t)); return 1 - Math.pow(1 - t, 3); };
const smooth = t => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };

const M = window.MATCH, TL = window.TL;
const HOME = M.home, AWAY = M.away, SIDES = { home: HOME, away: AWAY };
const P = window.PLAYERS;
for (const [id, p] of Object.entries(M.players)) P[id] = { ...p };

// ---------- running order (from the timeline build.py made) ----------
const SEGS = TL.segs.map(s => ({ ...s }));

const segOf = id => SEGS.find(s => s.id === id);

// ---------- helpers ----------

  if (stroke) { g.lineWidth = stroke; g.strokeStyle = "#000"; g.strokeText(s, x, y); }

}
function fitText(s, x, y, size, max, fill, o = {}) { g.font = `${size}px Anton`; g.letterSpacing = `${Math.round(size * 0.02)}px`; const w = g.measureText(s).width; text(s, x, y, w > max ? size * max / w : size, fill, o); }
// A label in a rounded box, centred on (x, y) both ways.
function pill(x, y, label, bg, fg = "#fff", size = 26, padX = 22) {
  g.font = `${size}px Anton`; g.letterSpacing = `${Math.round(size * 0.02)}px`; const w = g.measureText(label).width + padX * 2, h = size * 1.55;
  g.fillStyle = bg; g.beginPath(); g.roundRect(x - w / 2, y - h / 2, w, h, h / 2); g.fill();
  text(label, x, y + size * 0.04, size, fg, { stroke: 0, base: "middle" }); return w;
}
function stars(t, a = 1) {
  const bg = g.createRadialGradient(W / 2, H * 0.45, 40, W / 2, H * 0.45, H * 0.8); bg.addColorStop(0, "#1a2140"); bg.addColorStop(1, "#05070f");
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  let s = 7; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 140; i++) { const x = r() * W, y = r() * H, k = 0.4 + 0.6 * Math.abs(Math.sin(t * (0.5 + r()) + i)); g.fillStyle = `rgba(255,255,255,${0.55 * k * a})`; g.fillRect(x, y, r() < 0.15 ? 2 : 1, r() < 0.15 ? 2 : 1); }
}
// The club's crest: its real badge (club_logos) when the json gives one, else the drawn shield.
const IMG = {};
function shield(x, y, s, side) {
  const club = SIDES[side];
  if (club.badge && IMG[club.badge]) { const im = IMG[club.badge], k = Math.min(s * 1.08 / im.width, s * 1.16 / im.height); g.drawImage(im, x - im.width * k / 2, y - im.height * k / 2 + s * 0.04, im.width * k, im.height * k); return; }

  g.save(); g.translate(x, y); g.scale(s / 100, s / 100);
  const path = () => { g.beginPath(); g.moveTo(-46, -50); g.lineTo(46, -50); g.lineTo(46, 4); g.quadraticCurveTo(44, 40, 0, 58); g.quadraticCurveTo(-44, 40, -46, 4); g.closePath(); };
  path(); g.fillStyle = c.c; g.fill(); g.save(); g.scale(0.86, 0.86); path(); g.fillStyle = c.a; g.fill(); g.beginPath(); g.rect(-50, -18, 100, 12); g.fillStyle = c.b; g.fill(); g.restore();
  text(c.t, 0, 30, c.ts, c.tc, { stroke: 6 });
  g.restore();
}
// Flags: [kind, colours]. v = vertical bands, h = horizontal bands, cross = St George style, nordic, or an image path in club.flagImg.
const FLAGS = { eng: ["cross", "#fff", "#ce1124"], ita: ["v", "#009246", "#ffffff", "#ce2b37"], fra: ["v", "#002395", "#ffffff", "#ed2939"], irl: ["v", "#169b62", "#ffffff", "#ff883e"],
  bel: ["v", "#000000", "#fdda24", "#ef3340"], ger: ["h", "#000000", "#dd0000", "#ffce00"], ned: ["h", "#ae1c28", "#ffffff", "#21468b"], esp: ["h121", "#aa151b", "#f1bf00", "#aa151b"],
  aut: ["h", "#ed2939", "#ffffff", "#ed2939"], por: ["v25", "#006600", "#ff0000"], sco: ["saltire", "#005eb8", "#ffffff"], wal: ["h", "#ffffff", "#00b140"], ukr: ["h", "#0057b7", "#ffd700"],
  arg: ["h", "#74acdf", "#ffffff", "#74acdf"], col: ["h121r", "#fcd116", "#003893", "#ce1126"], rus: ["h", "#ffffff", "#0039a6", "#d52b1e"], den: ["nordic", "#c8102e", "#ffffff"], swe: ["nordic", "#006aa7", "#fecc00"],
  nor: ["nordic", "#ba0c2f", "#ffffff"], tur: ["h", "#e30a17", "#e30a17"], gre: ["h", "#0d5eaf", "#ffffff", "#0d5eaf", "#ffffff", "#0d5eaf"], sui: ["h", "#d52b1e", "#d52b1e"], bra: ["h", "#009c3b", "#009c3b"] };

  const h = w * 0.62; g.save(); g.translate(x - w / 2, y - h / 2);

  else if (kind === "nordic") { g.fillStyle = c[0]; g.fillRect(0, 0, w, h); g.fillStyle = c[1]; g.fillRect(w * 0.3, 0, w * 0.14, h); g.fillRect(0, h * 0.42, w, h * 0.16); }
  else if (kind === "saltire") { g.fillStyle = c[0]; g.fillRect(0, 0, w, h); g.strokeStyle = c[1]; g.lineWidth = h * 0.18; g.beginPath(); g.moveTo(0, 0); g.lineTo(w, h); g.moveTo(w, 0); g.lineTo(0, h); g.stroke(); }

  else if (kind === "h121") { g.fillStyle = c[0]; g.fillRect(0, 0, w, h); g.fillStyle = c[1]; g.fillRect(0, h * 0.25, w, h * 0.5); }
  else if (kind === "h121r") { g.fillStyle = c[0]; g.fillRect(0, 0, w, h * 0.5); g.fillStyle = c[1]; g.fillRect(0, h * 0.5, w, h * 0.25); g.fillStyle = c[2]; g.fillRect(0, h * 0.75, w, h * 0.25); }
  else c.forEach((col, i) => { g.fillStyle = col; g.fillRect(0, i * h / c.length, w, h / c.length + 0.5); });
  g.strokeStyle = "rgba(255,255,255,.7)"; g.lineWidth = 2; g.strokeRect(0, 0, w, h); g.restore();
}
function rays(cx, cy, t, col = "rgba(255,255,255,.07)") { g.save(); g.translate(cx, cy); g.rotate(t * 0.15); for (let i = 0; i < 14; i++) { g.rotate(Math.PI / 7); g.fillStyle = i % 2 ? col : "rgba(0,0,0,0)"; g.beginPath(); g.moveTo(0, 0); g.lineTo(-70, -1000); g.lineTo(70, -1000); g.closePath(); g.fill(); } g.restore(); }
const sideOf = id => (HOME.grid.includes(id) || id === HOME.manager || (HOME.extra || []).includes(id) || id === "you") ? "home" : "away";
const kitOf = id => id === "you" ? window.END_CARD_KIT : SIDES[sideOf(id)].kit;
// Faces ringed in their club's colour; the end-card face gold.
function av(id, x, y, r, opts = {}) { if (!(r > 0.5)) return; drawAvatar(g, x, y, r, P[id], kitOf(id), { ring: id === "you" ? GOLD : SIDES[sideOf(id)].colors.ring, ...opts }); }

// ---------- 1. WHO WOULD WIN? ----------
const GR = 42, HG = HOME.grid, AG = AWAY.grid;
function gridPos(id) {
  const side = sideOf(id), list = side === "home" ? HG : AG, i = list.indexOf(id), cx = side === "home" ? 172 : 508;
  if (id === HOME.manager || id === AWAY.manager) return [cx + 66, 290 + 5 * 126];
  if (i === 10) return [cx - 66, 290 + 5 * 126];
  return [cx + (i % 2 ? 66 : -66), 290 + Math.floor(i / 2) * 126];
}
function sceneGrid(t) {
  stars(t);
  const k = ease(t / 0.4); g.globalAlpha = k; text(M.title, CX, 150, 76, GOLD, { stroke: 12 });
  pill(172, 222, HOME.name, HOME.colors.pillBg, HOME.colors.pillFg, 26); pill(508, 222, AWAY.name, AWAY.colors.pillBg, AWAY.colors.pillFg, 26); g.globalAlpha = 1;
  const pop = (id, at) => { const p = back((t - at) / 0.3); if (p <= 0) return; const [x, y] = gridPos(id); av(id, x, y, GR * p); if (p > 0.6) text(P[id].name, x, y + GR + 26, 19, "#fff", { stroke: 5 }); };
  HG.forEach((id, i) => pop(id, 0.3 + i * 0.1)); AG.forEach((id, i) => pop(id, 0.35 + i * 0.1));
  if (HOME.manager) pop(HOME.manager, 1.65); if (AWAY.manager) pop(AWAY.manager, 1.7);
}
// ---------- 2. the circle (players only) ----------
const RING = [...HG, ...AG];
function ringPos(id, T) { const i = RING.indexOf(id), a = (i / RING.length) * Math.PI * 2 + T * 0.6; return [CX + Math.cos(a) * 250, 700 + Math.sin(a) * 140]; }
function sceneTitle(t) {
  stars(t + 3);
  const k = smooth(t / 0.9);
  for (const id of RING) { const [x0, y0] = gridPos(id), [x1, y1] = ringPos(id, t); av(id, lerp(x0, x1, k), lerp(y0, y1, k), lerp(GR, 34, k)); }
  for (const id of [HOME.manager, AWAY.manager].filter(Boolean)) { const [x, y] = gridPos(id); const a = 1 - smooth(t / 0.4); if (a > 0) { g.globalAlpha = a; av(id, x, y, GR); g.globalAlpha = 1; } }
  const q = ease((t - 0.2) / 0.4); g.globalAlpha = q;
  fitText(M.competition.title[0], CX, 190, 64, 640, "#fff", { stroke: 10 }); fitText(M.competition.title[1] || "", CX, 270, 60, 620, GOLD, { stroke: 10 });
  fitText(M.competition.tagline, CX, 330, 34, 620, "#fff", { stroke: 6 }); g.globalAlpha = 1;
}
// ---------- 3/5. team sheets, the faces flying in ----------
const SH = { top: 236, ph: 740, x: 40, w: 600 };
// Formation slots, as [x, y] fractions of the pitch (0,0 top-left; the keeper at the bottom). 4-2-3-1 and 3-4-2-1 are v4's.
const SHAPES = {
  "4-2-3-1": { GK: [0.5, 0.9], RB: [0.84, 0.72], CB1: [0.62, 0.76], CB2: [0.38, 0.76], LB: [0.16, 0.72], CM1: [0.64, 0.56], CM2: [0.36, 0.56], RW: [0.84, 0.34], CAM: [0.5, 0.4], LW: [0.16, 0.34], ST: [0.5, 0.17] },
  "3-4-2-1": { GK: [0.5, 0.9], RCB: [0.76, 0.73], CCB: [0.5, 0.7], LCB: [0.24, 0.73], RWB: [0.88, 0.5], CM1: [0.64, 0.56], CM2: [0.36, 0.56], LWB: [0.12, 0.5], RAM: [0.68, 0.3], LAM: [0.32, 0.3], ST: [0.5, 0.17] },
  "4-3-3": { GK: [0.5, 0.9], RB: [0.84, 0.72], CB1: [0.62, 0.76], CB2: [0.38, 0.76], LB: [0.16, 0.72], CM1: [0.74, 0.5], CM: [0.5, 0.56], CM2: [0.26, 0.5], RW: [0.82, 0.24], ST: [0.5, 0.17], LW: [0.18, 0.24] },
  "4-4-2": { GK: [0.5, 0.9], RB: [0.84, 0.72], CB1: [0.62, 0.76], CB2: [0.38, 0.76], LB: [0.16, 0.72], RM: [0.86, 0.46], CM1: [0.62, 0.52], CM2: [0.38, 0.52], LM: [0.14, 0.46], ST1: [0.66, 0.2], ST2: [0.34, 0.2] },
  "3-5-2": { GK: [0.5, 0.9], RCB: [0.76, 0.73], CCB: [0.5, 0.7], LCB: [0.24, 0.73], RWB: [0.88, 0.46], CM1: [0.7, 0.42], DM: [0.5, 0.54], CM2: [0.3, 0.42], LWB: [0.12, 0.46], ST1: [0.66, 0.18], ST2: [0.34, 0.18] },
  "4-1-2-1-2": { GK: [0.5, 0.9], RB: [0.84, 0.72], CB1: [0.62, 0.76], CB2: [0.38, 0.76], LB: [0.16, 0.72], DM: [0.5, 0.6], CM1: [0.76, 0.48], CM2: [0.24, 0.48], CAM: [0.5, 0.36], ST1: [0.68, 0.17], ST2: [0.32, 0.17] },
};
SHAPES["4-3-3"].RCM = SHAPES["4-3-3"].CM1; SHAPES["4-3-3"].LCM = SHAPES["4-3-3"].CM2; SHAPES["4-1-2-1-2"].CDM = SHAPES["4-1-2-1-2"].DM; SHAPES["3-5-2"].CDM = SHAPES["3-5-2"].DM;
function slotPos(id) {
  const club = SIDES[sideOf(id)], s = club.slots[id];
  const [fx, fy] = Array.isArray(s) ? s : (SHAPES[club.formation] || {})[s] || [0.5, 0.5];
  return [SH.x + fx * SH.w, SH.top + fy * SH.ph];
}
function pitch(x, y, w, h, a = 1) {
  g.globalAlpha = a; for (let i = 0; i < 10; i++) { g.fillStyle = i % 2 ? "#1f7a3a" : "#238843"; g.fillRect(x, y + i * h / 10, w, h / 10 + 1); }
  g.strokeStyle = "rgba(255,255,255,.55)"; g.lineWidth = 3; g.strokeRect(x + 10, y + 10, w - 20, h - 20);
  g.beginPath(); g.moveTo(x + 10, y + 10); g.arc(x + w / 2, y + 10, 70, 0, Math.PI); g.stroke();
  g.strokeRect(x + w / 2 - 130, y + h - 130, 260, 120); g.strokeRect(x + w / 2 - 60, y + h - 60, 120, 50); g.globalAlpha = 1;
}
function header(side, a) {
  const club = SIDES[side], c = club.colors;
  g.globalAlpha = a; g.fillStyle = c.headerBg; g.fillRect(0, 120, W, 100);
  (c.headerStripes || []).forEach((col, i) => { g.fillStyle = col; g.fillRect(0, 212 + i * 4, W, 4); });
  shield(84, 170, 68, side); fitText(club.full, 380, 186, 58, 480, c.headerFg, { stroke: 0 });
  text(club.sheetLabel, 380, 210, 20, c.headerSub, { stroke: 0 }); g.globalAlpha = 1;
}
function sceneSheetH(t) {

  pitch(SH.x, SH.top, SH.w, SH.ph, k); header("home", k);
  const T = segDur("title");
  for (const id of AG) { const [x0, y0] = ringPos(id, T); const a = 1 - smooth(t / 0.6); if (a <= 0) continue; g.globalAlpha = a; av(id, lerp(x0, CX, k), lerp(y0, 1300, k), 34 * (1 - 0.5 * k)); g.globalAlpha = 1; }
  for (const id of HG) {
    const [x0, y0] = ringPos(id, T), [x1, y1] = slotPos(id); const x = lerp(x0, x1, k), y = lerp(y0, y1, k), r = lerp(34, 50, k);
    av(id, x, y, r); if (k > 0.8) text(P[id].name, x, y + 76, 22, "#fff", { stroke: 5 });
  }
}
// ---------- 4. the atoms: the away eleven, spaced out, orbiting (their first name in the middle) ----------
function atomPos(id, t) { const i = AG.indexOf(id); if (i === 0) return [CX, 660]; const ring = i <= 4 ? 0 : 1, n = ring ? 6 : 4, j = ring ? i - 5 : i - 1, R = ring ? 250 : 140;
  const a = (j / n) * Math.PI * 2 + t * (ring ? -0.5 : 0.8); return [CX + Math.cos(a) * R, 660 + Math.sin(a) * R * 0.75]; }
function sceneAtoms(t) {

  g.strokeStyle = "rgba(255,255,255,.12)"; g.lineWidth = 2; g.beginPath(); g.ellipse(CX, 660, 140, 105, 0, 0, 7); g.stroke(); g.beginPath(); g.ellipse(CX, 660, 250, 187, 0, 0, 7); g.stroke();

    av(id, x, y, lerp(id === AG[0] ? 46 : 36, 50, k)); if (k > 0.8) text(P[id].name, x, y + 76, 22, "#fff", { stroke: 5 }); }
}
// ---------- 6. versus ----------
function sceneVersus(t) {
  const k = ease(t / 0.35);
  g.fillStyle = HOME.colors.versusBg; g.beginPath(); g.moveTo(0, 0); g.lineTo(W * 0.62 * k, 0); g.lineTo(W * 0.38 * k, H); g.lineTo(0, H); g.fill();
  g.fillStyle = AWAY.colors.versusBg; g.beginPath(); g.moveTo(W, 0); g.lineTo(W - W * 0.38 * k, 0); g.lineTo(W - W * 0.62 * k, H); g.lineTo(W, H); g.fill();

    const club = SIDES[sd], [n1, n2] = club.versus;
    const p = back((t - at) / 0.4); if (p <= 0) return; g.save(); g.translate(x, y); g.scale(p, p);
    g.fillStyle = "rgba(0,0,0,.35)"; g.beginPath(); g.arc(0, 0, 110, 0, 7); g.fill(); shield(0, 0, 150, sd); g.restore(); if (p < 0.7) return;
    flag(x, y + 160, 64, club.nation); fitText(n1, x, y + 250, 58, 330, "#fff", { stroke: 10 }); if (n2) fitText(n2, x, y + 304, 58, 330, "#fff", { stroke: 10 }); fitText(club.versusInfo, x, y + 346, 26, 330, GOLD, { stroke: 6 });
  };
  side("home", 190, 380, 0.25);
  side("away", 500, 740, 0.6);
  const v = back((t - 1.0) / 0.3); if (v > 0) { g.save(); g.translate(CX, 630); g.scale(v, v); text("VS", 0, 30, 110, GOLD, { stroke: 14, italic: true }); g.restore(); }
}
// ---------- 7. the globe ----------
const tex = new Image(); tex.src = "earth/earth.jpg"; let texData = null, TW = 0, TH = 0;
function texReady() { if (texData || !tex.complete) return; const c = document.createElement("canvas"); c.width = TW = tex.width; c.height = TH = tex.height; const x = c.getContext("2d"); x.drawImage(tex, 0, 0); texData = x.getImageData(0, 0, TW, TH).data; }

function globe(lat0, lon0, R, gcx, gcy) {

  const y0 = Math.max(0, Math.floor(gcy - R)), y1 = Math.min(H, Math.ceil(gcy + R)), x0 = Math.max(0, Math.floor(gcx - R)), x1 = Math.min(W, Math.ceil(gcx + R));

    o[i] = texData[ti] * sh; o[i + 1] = texData[ti + 1] * sh; o[i + 2] = texData[ti + 2] * sh; o[i + 3] = 255;

window.draw = async function (f) {
