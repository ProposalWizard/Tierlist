<script type="module">
/*
 * The NEW-CLIP sprite baker's page (a copy of ../bake.html; see bake-new.mjs).
 * Differences from ../bake.html: reads the meshopt-packed people3d body and
 * anims.glb from public/, builds keyframed clips (clips.js + defs.js), paints
 * the keeper's sleeves and gloves itself, scales the body by FIT (?s=&dy=), and
 * adds bakeNew / clipSheet / spike / spikeKeeper / atlasSheet.
 *
 * Conventions shared with lib/star/sprites.ts:
 *  - facing is a SCREEN angle, canvas style: 0 = right, PI/2 = down the screen.
 *  - the camera sits above, tilted toward the bottom of the screen, so a man
 *    facing down shows his front.
 *  - each frame's anchor is the ground point under the man (his boots).
 */
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { installClips } from "/clips.js";
import "/defs.js";

const CFG = {
  tilt: 25,          // degrees from straight down
  ppm: 56,           // pixels per metre (image plane) in the baked (2x) sprite
  ss: 4,             // supersampling of the render before the box-filter shrink
  view: { l: -2.1, r: 2.1, t: 2.4, b: -1.2 }, // image-plane metres round the anchor
  outlinePx: 2,      // 1 px at the game's size = 2 px in the 2x bake
  outline: [16, 22, 18],
  waist: 0.545, knee: 0.335, ankle: 0.072, // fractions of standing height

// ── GLB helpers ──
async function fetchBuf(url) { const r = await fetch(url); if (!r.ok) throw new Error(url + " " + r.status); return r.arrayBuffer(); }

  o.setUint32(0, 0x46546c67, true); o.setUint32(4, 2, true); o.setUint32(8, out.length, true);

const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const QS = new URLSearchParams(location.search); const BODY = QS.get("body") || "people3d"; const FILE = QS.get("file"); const FIT = { s: +(QS.get("s") || 1), dy: +(QS.get("dy") || 0) };

// ── Renderer ──
const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0xaab8ac, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 2.1);
sun.position.set(-1.6, 4, 1.4); // from the upper left of the screen, like the shadow (thrown lower right)
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffffff, 0.45);
fill.position.set(1.5, 1.2, 2.5);
scene.add(fill);
const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 50);
cam.up.set(0, 0, -1);
function setCamera(tiltDeg) {
  const t = (tiltDeg * Math.PI) / 180, D = 20;
  cam.position.set(0, D * Math.cos(t), D * Math.sin(t));
  cam.lookAt(0, 0, 0);

// ── Characters ──
const chars = {};
/** A packed Style A body: positions come quantized with extras.quant (as people3d.ts dequantize). */

async function loadChar(name, file, kitTest, keeper = false) {

  const g = skinned.geometry, n = g.attributes.position.count;
  const J = g.attributes.skinIndex, W = g.attributes.skinWeight;
  const v = new THREE.Vector3();
  const ys = new Float32Array(n);
  let minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < n; i++) {
    skinned.getVertexPosition(i, v); v.applyMatrix4(skinned.matrixWorld);
    ys[i] = v.y; if (v.y < minY) minY = v.y; if (v.y > maxY) maxY = v.y;

    let best = 0, bw = -1;
    for (let k = 0; k < 4; k++) { const w = W.getComponent(i, k); if (w > bw) { bw = w; best = J.getComponent(i, k); } }

    let r;
    if (/Head|head|neck/.test(bn)) r = 0;
    else if (/Hand/.test(bn)) r = keeper ? 7 : 5;
    else if (/Arm|Shoulder/.test(bn)) r = keeper ? 6 : 1;
    else if (f > CFG.waist) r = 1;
    else if (f > CFG.knee) r = 2;

      .replace("#include <map_fragment>", `#include <map_fragment>
        {
          vec3 c = pow(max(diffuseColor.rgb, vec3(0.0)), vec3(1.0/2.2));
          float mx = max(c.r, max(c.g, c.b)), mn = min(c.r, min(c.g, c.b));

          else if (gReg > 6.5) { gReg = 9.0; diffuseColor.rgb = vec3(0.72); } // keeper: light gloves

      .replace("#include <dithering_fragment>", `#include <dithering_fragment>

const clipCache = {};
async function loadClip(file, opts = {}) {

    // Run_02 travels: take out the drift of the hips over the loop, keep the sway.

// ── One frame ──
function pose(ch, clip, time, facing, dive) {
  ch.mixer.stopAllAction();

  ch.inner.traverse((o) => { if (o.isBone && o.userData.rest) { o.position.copy(o.userData.rest.p); o.quaternion.copy(o.userData.rest.q); o.scale.copy(o.userData.rest.s); } });

  ch.inner.position.set(0, FIT.dy, 0);
  ch.inner.rotation.set(0, 0, 0);

    // The leap clip goes straight up. Lay it over sideways: roll about his
    // own forward axis (pivot at the boots), carry him across, land him.
    const p = dive.p;

const W = Math.round((CFG.view.r - CFG.view.l) * CFG.ppm * CFG.ss);

const DIRS8 = Array.from({ length: 8 }, (_, i) => (i * Math.PI) / 4);

  { name: "jog", file: "player-jog.glb", frames: 8, inPlace: true, loop: "loop" },
  { name: "sprint", file: "player-sprint.glb", frames: 8, inPlace: true, loop: "loop" },
  { name: "kick", file: "player-kick.glb", frames: 6, from: 0.25, to: 0.95, fps: 9, loop: "once", strikeFrame: 3 },
  { name: "celebrate", file: "player-celebrate.glb", frames: 6, loop: "loop" },

  { name: "jog", file: "player-jog.glb", frames: 8, inPlace: true, loop: "loop" },

function timesFor(c, clip) {
  const from = c.from ?? 0, to = c.to ?? clip.duration;

    const f = c.loop === "loop" ? i / c.frames : c.frames > 1 ? i / (c.frames - 1) : 0;

window.bakerReady = false;
let ready = (async () => {
  setCamera(CFG.tilt);
  const p = await loadChar("player", FILE || "/star/" + BODY + "/player.glb", { sat: 0.16, v: 0.62 });
  restBones(p);
  const k = await loadChar("keeper", FILE || "/star/" + BODY + "/player.glb", { sat: 0.16, v: 0.62 }, true);
  restBones(k);
  scene.add(p.holder);
  window.__anims = (await parse(await fetchBuf("/star/people3d/anims.glb"))).animations; installClips(THREE, chars, window); window.bakerReady = true;

async function bakeChar(name, clips, dirs) {
  show(name);
  const ch = chars[name];
  if (!ch.holder.parent) scene.add(ch.holder);
  const out = [];
  for (const c of clips) {
    const clip = await loadClip(c.file, c);
    const ts = timesFor(c, clip);
    const fps = c.fps ?? c.frames / (((c.to ?? clip.duration) - (c.from ?? 0)) || clip.duration);
    const cl = { name: c.name, fps: +fps.toFixed(3), loop: c.loop, dirs: dirs.length, frames: c.frames, strikeFrame: c.strikeFrame, cells: [] };

/** Shelf-pack every frame into one atlas canvas pair. */

        times = timesFor({ ...c, frames: cl.frames, loop: cl.loop, from, to }, clip);
      } else {
        const def = window.CLIPS[nm]; clip = await loadClip("js:" + nm, {});
        times = Array.from({ length: cl.frames }, (_, i) => i);
        dives = (i) => diveFor(def, i, cl.frames);
      }
      const cells = [];
      for (const fac of dirs) for (let i = 0; i < cl.frames; i++) cells.push(bakeFrame(chars[cn], clip, times[i], fac, dives(i)));
      out[which].push({ cn, nm, cells });
    }
  }
  const files = {}, atlases = {};
  for (const which of [0, 1]) {
    const groups = out[which].map((g) => ({ clips: [{ cells: g.cells }] }));
    const atl = pack(groups);
    { const mc = atl.mask.getContext("2d"); const im = mc.getImageData(0, 0, atl.w, atl.h); const d = im.data;
      for (let i = 0; i < d.length; i += 4) for (let k = 0; k < 3; k++) d[i + k] = Math.round(d[i + k] / 63.75) * 63.75 | 0;
      mc.putImageData(im, 0, 0); }
    files[`atlas-${which}a.webp`] = atl.col.toDataURL("image/webp", 0.88);
    files[`mask-${which}a.png`] = atl.mask.toDataURL("image/png");
    atlases[which] = { color: `atlas-${which}a.webp`, mask: `mask-${which}a.png`, w: atl.w, h: atl.h };
  }
  // the same index, cells swapped for the new ones
  const idx = JSON.parse(JSON.stringify(index));
  idx.atlas = atlases[0];
  idx.atlases = { ...(idx.atlases ?? {}), 1: atlases[1] };
  for (const which of [0, 1]) for (const g of out[which]) {
    idx.chars[g.cn].clips[g.nm].cells = g.cells.map((f) => [f.px, f.py, f.w, f.h, +f.ax.toFixed(1), +f.ay.toFixed(1)]);
  }
  const standing = idx.chars.player.clips.idle.cells[2 * idx.chars.player.clips.idle.frames];
  idx.standH = standing[5];
  idx.style = "styleA";
  return { files, index: idx };
};

/** Rows of pairs: top = a, bottom = b, each at 2x bake size and zoomed 3x. */
function pairSheet(a, b, labels) {
  const n = a.length, cw = 130, rh = 330;
  const c = small(n * cw + 80, rh * 2 + 10); const g = c.getContext("2d");
  g.fillStyle = "#3f8f3a"; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = "#fff"; g.font = "bold 13px sans-serif";
  [a, b].forEach((row, r) => {
    g.fillText(labels[r], 4, r * rh + 16);
    row.forEach((f, i) => {
      const x = 80 + i * cw, y = r * rh;
      g.imageSmoothingEnabled = false;
      g.drawImage(f.color, x + 60 - f.ax * 1.5, y + 300 - f.ay * 1.5 - 120, f.w * 1.5, f.h * 1.5);
      g.imageSmoothingEnabled = true;
      g.drawImage(f.color, x + 60 - f.ax / 2, y + 300 - f.ay / 2, f.w / 2, f.h / 2); // game 1x
      g.fillStyle = "#f00"; g.fillRect(x + 59, y + 299, 2, 2); g.fillRect(x + 59, y + 179, 2, 2);
      g.fillStyle = "#fff";
    });
  });
  return c;
}
