<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<style>html,body{margin:0;background:transparent}</style></head><body>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { DRACOLoader } from "three/addons/loaders/DRACOLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { toCreasedNormals } from "three/addons/utils/BufferGeometryUtils.js";

const W = 1440, H = 1080;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const draco = new DRACOLoader(); draco.setDecoderPath("/three/examples/jsm/libs/draco/gltf/");
const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
loader.setMeshoptDecoder(MeshoptDecoder); // withMeshopt's decoder (three's own), as the game does

// paint swap: texels close to the family's paint hue take the level's colour
function paintSwap(m, p) {
  m.onBeforeCompile = (sh) => {
    sh.uniforms.pFrom = { value: new THREE.Color(p.from) };
    sh.uniforms.pTo = { value: new THREE.Color(p.to) };
    sh.uniforms.pTol = { value: p.tol ?? 0.09 };
    sh.uniforms.pSatMin = { value: p.satMin ?? 0.28 };
    sh.uniforms.pMetal = { value: p.metal ?? -1 };
    sh.uniforms.pRough = { value: p.rough ?? -1 };
    sh.uniforms.pFade = { value: p.fade ?? 0 };
    sh.fragmentShader = sh.fragmentShader
      .replace("#include <common>", `#include <common>
uniform vec3 pFrom; uniform vec3 pTo; uniform float pTol; uniform float pSatMin; uniform float pMetal; uniform float pRough; uniform float pFade;
float pMask;
vec3 rgb2hsv(vec3 c){vec4 K=vec4(0.,-1./3.,2./3.,-1.);vec4 p=mix(vec4(c.bg,K.wz),vec4(c.gb,K.xy),step(c.b,c.g));vec4 q=mix(vec4(p.xyw,c.r),vec4(c.r,p.yzx),step(p.x,c.r));float d=q.x-min(q.w,q.y);float e=1.0e-10;return vec3(abs(q.z+(q.w-q.y)/(6.*d+e)),d/(q.x+e),q.x);}
vec3 hsv2rgb(vec3 c){vec4 K=vec4(1.,2./3.,1./3.,3.);vec3 p=abs(fract(c.xxx+K.xyz)*6.-K.www);return c.z*mix(K.xxx,clamp(p-K.xxx,0.,1.),c.y);}`)
      .replace("#include <map_fragment>", `#include <map_fragment>
{ vec3 c = diffuseColor.rgb; vec3 h = rgb2hsv(c); vec3 hf = rgb2hsv(pFrom);
  float dh = abs(h.x - hf.x); dh = min(dh, 1.0 - dh);
  pMask = (1.0 - smoothstep(pTol*0.6, pTol, dh)) * smoothstep(pSatMin*0.7, pSatMin, h.y);
  vec3 ht = rgb2hsv(pTo);
  float v = h.z / max(hf.z, 0.05) * ht.z; // keep the shading, at the new colour's brightness
  vec3 nc = hsv2rgb(vec3(ht.x, ht.y, clamp(v, 0.0, 1.0)));
  diffuseColor.rgb = mix(c, nc, pMask);
  if (pFade > 0.0) { float l = dot(diffuseColor.rgb, vec3(0.3,0.59,0.11)); diffuseColor.rgb = mix(diffuseColor.rgb, vec3(l)*vec3(1.05,0.98,0.86), pFade); }
}`)
      .replace("#include <roughnessmap_fragment>", `#include <roughnessmap_fragment>
if (pRough >= 0.0) roughnessFactor = mix(roughnessFactor, pRough, pMask);`)
      .replace("#include <metalnessmap_fragment>", `#include <metalnessmap_fragment>
if (pMetal >= 0.0) metalnessFactor = mix(metalnessFactor, pMetal, pMask);`);
  };
  m.customProgramCacheKey = () => JSON.stringify(p);
  m.needsUpdate = true;
}

const cache = new Map();
async function load(url) { if (!cache.has(url)) cache.set(url, loader.loadAsync(url)); return (await cache.get(url)).scene.clone(true); }

window.render = async (s) => {
  const scene = new THREE.Scene();
  scene.environment = envTex; scene.environmentIntensity = s.env ?? 0.9;
  const root = await load(s.url);
  root.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = false;
    o.material = (Array.isArray(o.material) ? o.material[0] : o.material).clone();
    const m = o.material;
    if (m.map) m.map.anisotropy = 8;
    if (s.crease && o.geometry) o.geometry = toCreasedNormals(o.geometry, (38 * Math.PI) / 180);
    if (s.tone) m.color.multiplyScalar(s.tone);
    if (s.tint) m.color.copy(new THREE.Color("#ffffff").lerp(new THREE.Color(s.tint), s.tintK ?? 0.85));
    if (m.clearcoat > 0) m.clearcoatRoughness = Math.max(m.clearcoatRoughness ?? 0, 0.28);
    if (m.roughness < 0.24) m.roughness = 0.24;
    if (s.paint) paintSwap(m, s.paint);
  });
  // stand it up: long side along x for cars/boots, on the floor, centred
  root.updateMatrixWorld(true);
  let size = new THREE.Box3().setFromObject(root).getSize(new THREE.Vector3());
  if (s.longX && size.z > size.x) root.rotation.y = Math.PI / 2;
  root.rotation.y += (s.turn ?? 0) * Math.PI / 180;
  root.updateMatrixWorld(true);
  size = new THREE.Box3().setFromObject(root).getSize(new THREE.Vector3());
  root.scale.multiplyScalar(1 / Math.max(size.x, size.y, size.z));
  root.updateMatrixWorld(true);
  const b = new THREE.Box3().setFromObject(root), c = b.getCenter(new THREE.Vector3());
  root.position.x -= c.x; root.position.z -= c.z; root.position.y -= b.min.y;
  const g = new THREE.Group(); g.add(root); scene.add(g);
  g.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(g);

  // studio: a soft key, a rim from behind, a cool fill
  const key = new THREE.DirectionalLight(0xfff3e4, s.key ?? 2.4);
  key.position.set(-1.0, 4.2, 1.4); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 10; key.shadow.blurSamples = 20; key.shadow.bias = -0.0004;
  Object.assign(key.shadow.camera, { left: -1.2, right: 1.2, top: 1.2, bottom: -1.2, near: 0.1, far: 10 });
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xdfe9ff, s.rim ?? 2.0); rim.position.set(2.5, 2.2, -3.0); scene.add(rim);
  const fill = new THREE.DirectionalLight(0xcfe0ff, 0.5); fill.position.set(3, 1, 2); scene.add(fill);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 0.35));
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(6, 6), new THREE.ShadowMaterial({ opacity: s.shadow ?? 0.22 }));
  floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

  // camera: same angle per kind, then fit the item to the slot
  const cam = new THREE.PerspectiveCamera(s.fov ?? 26, W / H, 0.01, 100);
  const yaw = (s.yaw ?? -35) * Math.PI / 180, el = (s.elev ?? 14) * Math.PI / 180;
  const dir = new THREE.Vector3(Math.sin(yaw) * Math.cos(el), Math.sin(el), Math.cos(yaw) * Math.cos(el));
  const target = box.getCenter(new THREE.Vector3());
  let dist = 3;
  const fitW = s.fitW ?? 0.84, fitH = s.fitH ?? 0.8;
  const pts = []; for (let i = 0; i < 8; i++) pts.push(new THREE.Vector3(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z));
  for (let it = 0; it < 6; it++) {
    cam.position.copy(target).addScaledVector(dir, dist); cam.lookAt(target); cam.updateMatrixWorld(true);
    let x0 = 1, x1 = -1, y0 = 1, y1 = -1;
    for (const p of pts) { const q = p.clone().project(cam); x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y); }
    const k = Math.max((x1 - x0) / 2 / fitW, (y1 - y0) / 2 / fitH);
    // recentre: shift the target by the screen offset
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 - (s.lift ?? 0);
    const right = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 0), up = new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld, 1);
    const halfH = Math.tan(cam.fov * Math.PI / 360) * dist;
    target.addScaledVector(right, cx * halfH * cam.aspect).addScaledVector(up, cy * halfH);
    dist *= k;
  }
  cam.position.copy(target).addScaledVector(dir, dist); cam.lookAt(target);
  renderer.render(scene, cam);
  const url = renderer.domElement.toDataURL("image/png");
  scene.traverse((o) => { if (o.isMesh) { o.material.dispose?.(); } });
  key.shadow.map?.dispose();
  return url;
};
window.ready = true;
</script></body></html>
