<!DOCTYPE html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#efe9dd}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// Stat Twins engine v2 (Mikey's notes, 7 Nov 2026): faces, club badges, flags, % match,
// a long countdown with a spotlight card, real per-90 numbers. Every frame is drawn from t alone.
// boot(timeline, {meta:{series,source,imgDir}, scenes:{<lineId>:{type,...}}})  -> Promise (images preload)
const C=document.getElementById('c'), x=C.getContext('2d');
const CREAM='#efe9dd', CARD='#f8f4ec', INK='#141414', INK2='#5b564d', INK3='#9a9386', RED='#c8102e', LINE='#ddd5c5', BLUE='#1f5fbf', TRACK='#e6dfd1';
const SX0=64, SX1=950, CY0=196, CY1=1080;
let TL, SC, META, IMG={};
const F=(w,s)=>`${w} ${s}px Inter, "Inter Display", sans-serif`;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const ease=p=>{p=clamp(p);return 1-Math.pow(1-p,3)};
const back=p=>{p=clamp(p);const c1=1.6,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2)};
const eio=p=>{p=clamp(p);return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};
function rr(X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
function T(s,X,Y,font,col,align='left',a=1){if(a<=0)return;x.save();x.globalAlpha*=a;x.font=font;x.fillStyle=col;x.textAlign=align;x.textBaseline='alphabetic';x.fillText(s,X,Y);x.restore();}
function fit(s,w,size,maxW){x.font=F(w,size);const m=x.measureText(s).width;return m>maxW?size*maxW/m:size;}
function seg(t){let s=TL.segs[0];for(const q of TL.segs) if(t>=q.start-0.05) s=q;return s;}
function wordT(s,pre){if(typeof pre==='number')return s.start+pre;const w=s.words.find(w=>w.w.replace(/[^A-Z0-9#%.,']/gi,'').toUpperCase().startsWith(String(pre).toUpperCase()));return w?w.t:s.start;}
// pictures
function face(key,cx,cy,r,a=1,ring=null){ if(a<=0)return; x.save();x.globalAlpha*=a;
  x.beginPath();x.arc(cx,cy,r,0,7);x.fillStyle='#e3dccd';x.fill();
  const im=IMG[key]; if(im){x.save();x.beginPath();x.arc(cx,cy,r,0,7);x.clip();const s=r*2.05;x.drawImage(im,cx-s/2,cy-r*0.98,s,s);x.restore();}
  if(ring){x.lineWidth=Math.max(3,r*0.07);x.strokeStyle=ring;x.beginPath();x.arc(cx,cy,r,0,7);x.stroke();}
  x.restore();}
function icon(key,X,Y,s,a=1){const im=IMG[key]; if(!im||a<=0)return; x.save();x.globalAlpha*=a;const k=Math.min(s/im.width,s/im.height);x.drawImage(im,X+(s-im.width*k)/2,Y+(s-im.height*k)/2,im.width*k,im.height*k);x.restore();}
function flag(key,X,Y,s,a=1){const im=IMG[key]; if(!im||a<=0)return; x.save();x.globalAlpha*=a;x.beginPath();x.arc(X+s/2,Y+s/2,s/2,0,7);x.clip();x.drawImage(im,X,Y,s,s);x.restore();}

function chrome(){
  x.fillStyle=CREAM;x.fillRect(0,0,1080,1920);
  T((META.series||'STAT TWINS').toUpperCase(),SX0,150,F(800,26),INK3);x.fillStyle=RED;x.fillRect(SX0,162,54,5);
  T(META.source||'',SX0,1500,F(500,22),INK3);
}
function cardBg(){x.fillStyle=CARD;rr(SX0,CY0,SX1-SX0,CY1-CY0,26);x.fill();x.strokeStyle=LINE;x.lineWidth=2;x.stroke();}
function enter(p,cont){cardBg();const e=cont?1:ease(p/0.3);x.save();x.globalAlpha=e;x.translate(0,(1-e)*30);return()=>x.restore();}

// captions
function chunks(s){const out=[];let cur=[];for(const w of s.words){cur.push(w);if(cur.length>=3||/[.,?!:]$/.test(w.w)){out.push(cur);cur=[];}}if(cur.length)out.push(cur);return out;}
function captions(t,s){
  if(t>s.start+s.vo+0.25) return; const cs=chunks(s); let cur=null;
  for(const c of cs) if(t>=c[0].t-0.04) cur=c; if(!cur) return;
  const pop=ease((t-cur[0].t)/0.12), text=cur.map(w=>w.w).join(' ');
  const size=fit(text,900,80,SX1-SX0-20); x.font=F(900,size); let X=(SX0+SX1)/2-x.measureText(text).width/2; const Y=1300;
  x.save();x.translate((SX0+SX1)/2,Y);x.scale(.92+.08*pop,.92+.08*pop);x.translate(-(SX0+SX1)/2,-Y);
  for(let i=0;i<cur.length;i++){const w=cur[i];const on=t>=w.t-0.03;const last=(i===cur.length-1)||t<cur[i+1].t-0.03;
    x.globalAlpha=on?1:.28;x.fillStyle=on&&last?RED:INK;x.font=F(900,size);x.textAlign='left';x.fillText(w.w,X,Y);X+=x.measureText(w.w+' ').width;}
  x.restore();
}
const S={};
// ---- intro: who + what data, one card
S.intro=(sc,p,s,t)=>{ const done=enter(p);
  const a1=back((p-0.05)/0.45); face(sc.face,SX0+190,CY0+215,150*clamp(a1,0,1.2),clamp(a1*2),RED);
  T('FINDING THE',SX0+380,CY0+120,F(800,28),RED,'left',ease((p-.1)/.3)); T('STATISTICAL TWIN OF',SX0+380,CY0+156,F(800,28),RED,'left',ease((p-.1)/.3));
  const ns=fit(sc.name,900,92,SX1-SX0-420); T(sc.name,SX0+380,CY0+250,F(900,ns),INK,'left',ease((p-.2)/.3));
  T(sc.season,SX0+380,CY0+300,F(800,40),INK,'left',ease((p-.3)/.3));
  icon(sc.club,SX0+380,CY0+320,64,ease((p-.4)/.3)); flag(sc.flag,SX0+460,CY0+326,52,ease((p-.45)/.3));
  x.fillStyle=LINE;x.fillRect(SX0+44,CY0+440,SX1-SX0-88,2);
  (sc.facts||[]).forEach((f,i)=>{const at=sc.at?wordT(s,sc.at[i]):s.start+0.8+i*0.6;const a=ease((t-at)/0.35);const y=CY0+530+i*92;
    T(f[0],SX0+44,y,F(900,54),RED,'left',a); T(f[1],SX0+44+fit(f[0],900,54,999)*0+ (x.font=F(900,54),x.measureText(f[0]).width)+22,y,F(700,34),INK,'left',a);});
  done();};
// ---- countdown with spotlight; one scene per line, `upto` = lowest rank revealed in this line
S.countdown=(sc,p,s,t)=>{ const L=SC.__lists[sc.list]; const done=enter(p,sc.cont);
  const rows=L.rows, n=rows.length; let revealT=sc.at?wordT(s,sc.at):s.start+0.15; let k=sc.upto; // rank being revealed now (1-based)
  if(sc.steps){ // several ranks revealed in one line: [[rank, word], ...] in order
    k=sc.steps[0][0]+1; revealT=s.start; for(const [rk,w] of sc.steps){const tt=wordT(s,w); if(t>=tt){k=rk;revealT=tt;}} if(k>n){k=sc.steps[0][0];revealT=wordT(s,sc.steps[0][1]);} }
  // header
  T(L.title,SX0+44,CY0+70,F(900,46),INK); T(L.sub.toUpperCase(),SX0+44,CY0+102,F(600,20),INK3);
  // spotlight (top)
  const spY=CY0+130, spH=300; const cur=(t>=revealT)?k:k+1; // the player in the big card: new one once revealed, else the last one
  const sp=(cur&&cur<=n)?rows[cur-1]:null; const rT=(cur===k)?revealT:-99; const ra=back((t-rT)/0.45), sa=ease((t-rT)/0.3);
  x.fillStyle='#fff';rr(SX0+30,spY,SX1-SX0-60,spH,22);x.fill();
  const tx=SX0+290, tw=SX1-60-tx;
  if(!sp){ // target shown before the first reveal
    const g=L.target; face(g.face,SX0+150,spY+150,105,1,INK3); T('MATCHING',tx,spY+95,F(800,24),INK3);
    T(g.name,tx,spY+165,F(900,fit(g.name,900,56,tw)),INK); T(g.season,tx,spY+210,F(700,30),INK2);
    T('#'+k+' ?',SX1-60,spY+95,F(900,40),INK3,'right',clamp((t-s.start)/0.2));
  } else {
    const K=cur; face(sp.face,SX0+150,spY+150,112*clamp(ra,0,1.15),clamp(ra*2),K===1?RED:null);
    T('#'+K,tx,spY+92,F(900,40),K===1?RED:INK3,'left',sa);
    const pc=Math.round(sp.match*clamp((t-rT)/0.6)); T(pc+'% match',SX1-60,spY+92,F(900,48),K===1?RED:INK,'right',sa);
    T(sp.name,tx,spY+160,F(900,fit(sp.name,900,60,tw)),K===1?RED:INK,'left',sa);
    T(sp.season,tx,spY+208,F(700,30),INK2,'left',sa); x.font=F(700,30); const sw=x.measureText(sp.season).width;
    icon(sp.club,tx+sw+16,spY+176,44,sa); flag(sp.flag,tx+sw+70,spY+180,36,sa);
    const ln=sp.sure&&K===1?sp.sure:sp.line; if(ln) T(ln,tx,spY+258,F(700,28),K===1?RED:INK2,'left',ease((t-rT-0.5)/0.3));
  }
  // list (bottom-up)
  const ly=spY+spH+24, rowH=Math.min(70,(CY1-ly-14)/n);
  for(let i=0;i<n;i++){const r=rows[i], rank=i+1, yy=ly+i*rowH;
    const shown = rank>k || (rank===k && t>=revealT);
    T('#'+rank,SX0+44,yy+rowH*0.62,F(800,24),rank===1&&shown?RED:INK3);
    if(!shown){x.fillStyle=TRACK;rr(SX0+96,yy+8,SX1-SX0-140,rowH-16,10);x.fill();T('?',(SX0+SX1)/2+20,yy+rowH*0.66,F(900,28),INK3,'center');continue;}
    const a=rank===k?ease((t-revealT)/0.4):1; const fr=rowH*0.38;
    face(r.face,SX0+96+fr,yy+rowH/2,fr,a); const nx=SX0+96+fr*2+16;
    T(r.name,nx,yy+rowH*0.5,F(900,fit(r.name,900,28,330)),rank===1?RED:INK,'left',a);
    T(r.season,nx,yy+rowH*0.83,F(600,18),INK3,'left',a);
    icon(r.club,SX0+560,yy+rowH/2-17,34,a); flag(r.flag,SX0+604,yy+rowH/2-14,28,a);
    const bw=150*((r.match-50)/50); x.globalAlpha=a; x.fillStyle=rank===1?RED:'#2b2925'; rr(SX1-44-60-bw-14,yy+rowH/2-8,bw,16,5);x.fill(); x.globalAlpha=1;
    T(Math.round(r.match)+'%',SX1-44,yy+rowH*0.64,F(900,28),rank===1?RED:INK,'right',a);}
  done();};
// ---- real numbers, two players, per 90
S.compare=(sc,p,s,t)=>{ const done=enter(p);
  T(sc.kicker.toUpperCase(),SX0+44,CY0+60,F(700,22),INK3); T(sc.title,SX0+44,CY0+118,F(900,fit(sc.title,900,56,SX1-SX0-88)),INK);
  const hy=CY0+150; [[sc.a,RED,SX0+44],[sc.b,BLUE,SX0+470]].forEach(([pl,col,X])=>{face(pl.face,X+40,hy+46,40,1,col);T(pl.name,X+94,hy+40,F(900,fit(pl.name,900,30,300)),col);T(pl.season,X+94,hy+74,F(600,22),INK2);});
  const y0=hy+130, n=sc.rows.length, rowH=Math.min(150,(CY1-30-y0)/n), bx=SX0+44, bw=SX1-SX0-88-150;
  sc.rows.forEach((r,i)=>{const at=sc.at?wordT(s,sc.at[i]):s.start+0.3+i*(s.vo*0.7/n);const a=ease((t-at)/0.5);const yy=y0+i*rowH;
    x.save();x.globalAlpha=clamp(a*2);T(r.label,bx,yy+30,F(800,30),INK);T(r.unit||'per 90',bx+fit('x',800,30,999)*0+ (x.font=F(800,30),x.measureText(r.label).width)+14,yy+30,F(500,22),INK3);
    const mx=Math.max(r.a,r.b)*1.08;
    [[r.a,RED,0],[r.b,BLUE,1]].forEach(([v,col,j])=>{const yb=yy+46+j*36;x.fillStyle=TRACK;rr(bx,yb,bw,24,6);x.fill();x.fillStyle=col;rr(bx,yb,Math.max(6,bw*v/mx*a),24,6);x.fill();
      T((j?r.bTxt:r.aTxt)||String(v),SX1-44,yb+22,F(900,32),col,'right');});
    if(r.note) T(r.note,bx,yy+rowH-10,F(600,20),INK2);
    x.restore();});
  done();};
// ---- big statement card (e.g. "Still #1 in 8 of 10 tests")
S.statement=(sc,p,s,t)=>{ const done=enter(p);
  if(sc.face) face(sc.face,(SX0+SX1)/2,CY0+230,140,back((p-0.05)/0.45),RED);
  (sc.lines||[]).forEach((l,i)=>{const at=sc.at?wordT(s,sc.at[i]):s.start+0.2+i*0.5;const a=ease((t-at)/0.35);const sz=fit(l[0],900,l[1]||64,SX1-SX0-88);
    T(l[0],(SX0+SX1)/2,CY0+(sc.face?470:200)+i*110,F(900,sz),l[2]||INK,'center',a);});
  if(sc.dots){const at=wordT(s,sc.dots.at);const n=sc.dots.total||10;for(let i=0;i<n;i++){const a=ease((t-at-i*0.08)/0.25);const sp=Math.min(72,(SX1-SX0-120)/n), cx=(SX0+SX1)/2+(i-(n-1)/2)*sp, cy=CY1-120;
    x.globalAlpha=a;x.fillStyle=i<sc.dots.n?RED:TRACK;x.beginPath();x.arc(cx,cy,Math.min(26,sp*0.38),0,7);x.fill();x.globalAlpha=1;}}
  done();};
S.end=(sc,p,s,t)=>{ x.fillStyle=CREAM;x.fillRect(0,0,1080,1920); const a=ease(p/0.4), cx=(SX0+SX1)/2;
  if(sc.faces){sc.faces.forEach((f,i)=>face(f,cx+(i?110:-110),420,120,back((p-0.1-i*0.15)/0.45),i?BLUE:RED));T('=',cx,450,F(900,90),INK,'center',a);}
  T('KNOWITBALL',cx,700,F(900,110),INK,'center',a);x.fillStyle=RED;x.globalAlpha=a;x.fillRect(cx-90,735,180,8);x.globalAlpha=1;
  (sc.lines||[]).forEach((l,i)=>T(l,cx,860+i*86,F(900,68),i===0?RED:INK,'center',ease((p-0.3-i*0.15)/0.4)));
  const pa=ease((p-0.6)/0.4);x.save();x.globalAlpha=pa;x.font=F(800,44);const w=x.measureText('knowitball.co.uk').width+70;x.fillStyle='#1f9d55';rr(cx-w/2,1080,w,92,46);x.fill();T('knowitball.co.uk',cx,1142,F(800,44),'#fff','center');x.restore();};

function render(t){const s=seg(t);const sc=SC[s.id]||{type:'end'};chrome();(S[sc.type])(sc,t-s.start,s,t);if(sc.type!=='end'||sc.captions)captions(t,s);}
function boot(tl,scenes){TL=tl;SC=scenes.scenes;META=scenes.meta||{};SC.__lists=scenes.lists||{};
  const keys=new Set();JSON.stringify(scenes,(k,v)=>{if(typeof v==='string'&&/^[ptc][A-Za-z0-9]+$/.test(v)&&['face','club','flag','faces'].some(()=>true))keys.add(v);return v;});
  const dir=META.imgDir; const ps=[...keys].map(k=>new Promise(r=>{const im=new Image();im.onload=()=>{IMG[k]=im;r()};im.onerror=()=>r();im.src='file://'+dir+'/'+k+'.png';}));
  return Promise.all(ps).then(()=>Object.keys(IMG).length);}
window.render=render;window.boot=boot;
</script></body></html>
