const capMat=new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:1,roughness:.38});

  sh.vertexShader='varying vec3 vC;\n'+sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\nvC=position;');
  sh.fragmentShader='varying vec3 vC;uniform float uZ,uRC,uSx,uNx,uSy,uNy;uniform vec3 uPen[12];uniform vec3 uHex[20];\n'+

  if(d<uRC){vec3 n=normalize(P);float b=-9.,s2=-9.;int pi=0;
    for(int i=0;i<12;i++){float v=dot(uPen[i],n)/1.0265;if(v>b){s2=b;b=v;pi=1;}else if(v>s2)s2=v;}
    for(int i=0;i<20;i++){float v=dot(uHex[i],n);if(v>b){s2=b;b=v;pi=0;}else if(v>s2)s2=v;}

// ---------- knife ----------

 for(const x of[-0.2,-0.47,-0.74]){const r=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.09,12),new THREE.MeshStandardMaterial({color:0xc9c9c9,metalness:1,roughness:.3}));r.rotation.x=Math.PI/2;r.position.set(x,0.24,0);knife.add(r);}}

const camera=new THREE.PerspectiveCamera(30,W/H,0.1,60);

function chopCycle(u){ // u in [0,1): returns depth of edge 0=top..1=through
  return u<0.55?Math.pow(u/0.55,1.6):1-(u-0.55)/0.45;}

function frame(t){

  camera.position.set(0.3*cam,5.6*cam,10.6*cam);camera.lookAt(0,0.55,-0.2);
