<script type="module">
import * as THREE from 'three';

const W=540,H=960;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- textures ----------

const boardG=new THREE.Group();boardG.rotation.y=0.62;scene.add(boardG);
const board=new THREE.Mesh(new THREE.BoxGeometry(11,0.17,4.2),[0,0,0,0,0,0].map((_,i)=>new THREE.MeshStandardMaterial({map:woodTex,roughness:.7,color:i===2?0xffffff:0xd2b083})));

// ---------- cut face ----------

  float sa=(x-uSt.x)/uSt.z,sb=(y-uSt.y)/uSt.w,sc=z/uStz;
  if(sa*sa+sb*sb+sc*sc<1.)col=vec3(.42,.24,.12);
  else if(depth<.045)col=vec3(.10,.27,.07);
  else if(depth<.16){float k=(depth-.045)/.115;col=vec3(.26+.44*k,.56+.27*k,.12+.28*k);}
  else col=vec3(.70,.83,.40);
  float Lc=max(cutLine(x,uOx,uSx,uNx),cutLine(y,uOy,uSy,uNy));col*=1.-.35*Lc;diffuseColor.rgb=col;`);};
const cap=new THREE.Mesh(new THREE.PlaneGeometry(L,2.2*RM,1,1),capMat);cap.geometry.translate(0,1.1*RM,0);cap.receiveShadow=true;obj.add(cap);

// ---------- knife ----------
const knife=new THREE.Group();
{const s=new THREE.Shape();const BL=4.6,BH=0.66;s.moveTo(0,0);s.lineTo(BL-0.25,0);s.quadraticCurveTo(BL,0.02,BL+0.05,0.12);s.quadraticCurveTo(BL-0.4,BH,BL-0.9,BH);s.lineTo(0,BH);s.lineTo(0,0);
 const g=new THREE.ExtrudeGeometry(s,{depth:0.016,bevelEnabled:true,bevelThickness:0.004,bevelSize:0.006,bevelSegments:1,curveSegments:16});g.translate(0,0,-0.008);
 const blade=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x9ca2a7,metalness:1,roughness:.36}));blade.castShadow=true;knife.add(blade);
 const hd=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.22,0.09),new THREE.MeshStandardMaterial({color:0x6b3a1e,roughness:.5}));hd.position.set(-0.55,0.32,0);hd.castShadow=true;knife.add(hd);
 for(const x of[-0.25,-0.55,-0.85]){const r=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.1,10),new THREE.MeshStandardMaterial({color:0xcfcfcf,metalness:1,roughness:.3}));r.rotation.x=Math.PI/2;r.position.set(x,0.32,0);knife.add(r);}}
obj.add(knife);
const ghosts=[];for(let i=0;i<5;i++){const g=knife.clone(true);g.traverse(o=>{if(o.isMesh){o.material=o.material.clone();o.material.transparent=true;o.castShadow=false;o.material.depthWrite=false}});ghosts.push(g);obj.add(g)}
function basis(x,y){x=new THREE.Vector3(...x).normalize();y=new THREE.Vector3(...y).normalize();const z=new THREE.Vector3().crossVectors(x,y);return new THREE.Quaternion().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,y,z))}
// A: down cuts at x=const; blade in the x=const plane, edge pointing down-ish, tip toward camera-front
const QA=basis([-0.54,-0.59,0.57],[0.75,-0.1,0.6]);
// B: sideways cuts at y=const; blade horizontal, edge toward -x (enters from right)
const QB=basis([1,0,0],[0,0,-1]).multiply(new THREE.Quaternion()); const QB2=basis([-0.0,0,-1],[1,0,0]);
// C: dice at z=const; blade along x, edge down, handle on the left
const QC=basis([1,-0.04,0],[0.04,1,0]);
function place(o,q,edge,anchor){const off=new THREE.Vector3(anchor,0,0).applyQuaternion(q);o.quaternion.copy(q);o.position.copy(edge).sub(off);}

// ---------- plan ----------
let P=null,RD=null;const dummy=new THREE.Object3D();let ims=[];
function chop(u){return u<0.5?Math.pow(u/0.5,1.5):1-(u-0.5)/0.5;}
function buildRound(rd,seed){
  const r=rng(seed);const{kx,ky,kz}=rd;const G=44;
  const x0=-L/2,x1=L/2,y0=0,y1=2*RM*EH,z0=-RM,z1=RM;
  const sxc=(x1-x0)/(kx+1),syc=(y1-y0)/(ky+1),szc=(z1-z0)/(kz+1);

  const cells=[];

    const c=inStone(x,y,z)?[0.36,0.36,0.2]:flesh(x,y,z);const v=0.93+r()*0.12;cells.push({x,y,z,col:[c[0]*v,c[1]*v,c[2]*v],j:r(),r2:r(),r3:r()});}
  const b=s;const hf=new Map();const K=(a,c)=>a+','+c;
  for(const c of cells.sort((a,b)=>b.z-a.z)){const need=Math.min(kz,Math.ceil((z1-c.z)/szc));c.tr=rd.c0+(need-0.5)/kz*(rd.c1-rd.c0)+c.j*0.03;
    let bx=Math.round((c.x*0.62+(c.r2-.5)*0.5*s)/b),bz=Math.round((c.z*0.4+0.45+c.y*0.12+(c.r3-.5)*0.5*s)/b);
    for(let it=0;it<50;it++){const h=hf.get(K(bx,bz))||0;let best=null,bh=h;for(const[dx,dz]of[[1,0],[-1,0],[0,1],[0,-1]]){const hn=hf.get(K(bx+dx,bz+dz))||0;if(hn<bh-2.6*b){bh=hn;best=[dx,dz]}}if(!best)break;bx+=best[0];bz+=best[1];}
    const h=hf.get(K(bx,bz))||0;c.tx=bx*b+(c.r2-.5)*.2*b;c.tz=bz*b+(c.r3-.5)*.2*b;c.ty=h+.5*b;hf.set(K(bx,bz),h+b*.88);
    if(cells.length>4000){c.tx=c.x*1.1+(c.r2-.5)*.3*s;c.tz=c.z*1.22+0.3+(c.r3-.5)*.3*s;c.ty=Math.max(0.5*s,c.y*0.86);}

    cells.forEach((c,k)=>{c.tx=T[k][0];c.ty=T[k][1];c.tz=T[k][2];});}
  for(const m of ims){obj.remove(m);m.dispose()}ims=[];
  const im=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),new THREE.MeshStandardMaterial({roughness:.6}),cells.length);
  im.castShadow=true;im.receiveShadow=true;cells.forEach((c,i)=>{c.idx=i;im.setColorAt(i,new THREE.Color(...c.col))});obj.add(im);ims.push(im);

}
const camera=new THREE.PerspectiveCamera(28,W/H,0.1,80);
function setPlan(plan){P=plan;RD=null;return true}
function roundAt(t){let i=0;while(i<P.rounds.length-1&&t>=P.rounds[i+1].t0)i++;return i}
function knifePose(t,rd){const{kx,ky,kz,a0,a1,b0,b1,c0,c1}=rd;const yT=2*RM*EH+1.25;const q=new THREE.Quaternion(),p=new THREE.Vector3();let anc=1.6;
  if(t<a1){const u=Math.max(0,(t-a0)/(a1-a0));const f=u*kx;const ci=Math.min(kx,Math.floor(f)+1);const x=RD.x0+ci*RD.sxc;const d=t<a0?0.35:chop(f-Math.floor(f));q.copy(QA);p.set(x,yT-(yT+0.02)*d,0.0);anc=3.4;}
  else if(t<b0){const e=(t-a1)/(b0-a1);q.copy(QA).slerp(QB2,Math.min(1,e*1.5));p.set(L/2+1.8-0.6*e,0.3+0.8*(1-e),0);anc=1.5;}

  else if(t<c1){const u=(t-c0)/(c1-c0);const f=u*kz;const ci=Math.min(kz,Math.floor(f)+1);const z=RD.z1-ci*RD.szc;q.copy(QC);p.set(-0.2,(yT+0.6)-(yT+0.62)*chop(f-Math.floor(f)),z);anc=2.3;}

function frame(t){
  const ri=roundAt(t);const rd=P.rounds[ri];if(!RD||RD.idx!==ri){buildRound({...rd,idx:ri},100+ri);}
  const lt=t;const{kx,ky,kz,a0,a1,b0,b1,c0,c1}=RD;const cam=rd.cam;
  camera.position.set(cam[0],cam[1],cam[2]);camera.lookAt(cam[3],cam[4],cam[5]);camera.fov=cam[6]||28;camera.updateProjectionMatrix();

  for(const c of RD.cells){let x=c.x,y=c.y,z=c.z;dummy.quaternion.identity();const vis=lt>=c.tr;
    if(vis){rel++;const u=Math.min(1,(lt-c.tr)/c.dur);const uh=1-Math.pow(1-u,1.4);x=c.x+(c.tx-c.x)*uh;z=c.z+(c.tz-c.z)*uh;y=c.y+(c.ty-c.y)*(u*u);dummy.quaternion.slerp(c.q,u);}
    dummy.position.set(x,y,z);dummy.scale.setScalar(vis?sc:0);dummy.updateMatrix();RD.im.setMatrixAt(c.idx,dummy.matrix);}
  RD.im.instanceMatrix.needsUpdate=true;
  // counters: copied from the reference's own numbers, per frame
  const fi=Math.min(P.cuts.length-1,Math.round(t*30));
  document.getElementById('cuts').textContent=P.cuts[fi];document.getElementById('cubes').textContent=P.cubes[fi];
  renderer.render(scene,camera);return{ri,nx,ny,rel,cells:RD.cells.length};
}
window.setPlan=setPlan;window.frame=frame;window.ready=true;
</script></body></html>
